name = "a10-hairsalon-api"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = []

[[d1_databases]]
binding = "DB"
database_name = "a10-hairsalon"
database_id = "local-dev-db"

[env.production]
name = "a10-hairsalon-api-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "a10-hairsalon-prod"
database_id = "4ee369b0-85de-46ac-8173-06a5f0e9ecfe"

# 秘密情報（LINE_CHANNEL_ID / LINE_CHANNEL_SECRET / LINE_CHANNEL_ACCESS_TOKEN）は
# このファイルに書かないこと。本番は Cloudflare Workers Secrets に登録する:
#   npx wrangler secret put LINE_CHANNEL_SECRET --env production
# ローカル開発は apps/api/.dev.vars（Git管理外）に書く。雛形は .dev.vars.example。
